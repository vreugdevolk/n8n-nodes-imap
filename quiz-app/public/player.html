<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pub Quiz - Speler</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      color: white;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }

    header h1 {
      font-size: 1.5rem;
      color: #e94560;
      margin-bottom: 5px;
    }

    .player-name {
      font-size: 1.2rem;
      color: #4ecdc4;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.1);
      padding: 15px 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .status-item {
      text-align: center;
    }

    .status-label {
      font-size: 0.8rem;
      color: #a8dadc;
      margin-bottom: 5px;
    }

    .status-value {
      font-size: 1.2rem;
      font-weight: bold;
    }

    .question-section {
      margin-bottom: 20px;
    }

    .question-card {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      padding: 25px;
      margin-bottom: 20px;
    }

    .question-number {
      font-size: 0.9rem;
      color: #a8dadc;
      margin-bottom: 10px;
    }

    .question-text {
      font-size: 1.3rem;
      line-height: 1.5;
    }

    .answer-section {
      margin-bottom: 20px;
    }

    .answer-input {
      width: 100%;
      padding: 20px;
      font-size: 1.2rem;
      border: none;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.9);
      color: #1a1a2e;
      margin-bottom: 15px;
    }

    .answer-input:focus {
      outline: 3px solid #4ecdc4;
    }

    .submit-btn {
      width: 100%;
      padding: 20px;
      font-size: 1.3rem;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #4ecdc4 0%, #45b7aa 100%);
      color: white;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(78, 205, 196, 0.4);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .submit-btn:disabled {
      background: #666;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .submitted-badge {
      text-align: center;
      padding: 20px;
      background: rgba(78, 205, 196, 0.2);
      border: 2px solid #4ecdc4;
      border-radius: 10px;
      margin-top: 15px;
    }

    .submitted-badge .icon {
      font-size: 2rem;
      margin-bottom: 10px;
    }

    .waiting-screen {
      text-align: center;
      padding: 40px 20px;
    }

    .waiting-screen h2 {
      font-size: 1.8rem;
      margin-bottom: 20px;
      animation: pulse 2s infinite;
    }

    .waiting-screen p {
      color: #a8dadc;
      font-size: 1.1rem;
    }

    .answer-reveal {
      background: rgba(78, 205, 196, 0.1);
      border: 2px solid #4ecdc4;
      border-radius: 10px;
      padding: 20px;
      margin-top: 20px;
      text-align: center;
    }

    .answer-reveal .label {
      font-size: 0.9rem;
      color: #a8dadc;
      margin-bottom: 10px;
    }

    .answer-reveal .correct-answer {
      font-size: 1.5rem;
      color: #4ecdc4;
      font-weight: bold;
    }

    .your-answer {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 15px;
      margin-top: 15px;
    }

    .your-answer .label {
      font-size: 0.8rem;
      color: #a8dadc;
      margin-bottom: 5px;
    }

    .your-answer .text {
      font-size: 1.1rem;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .leaderboard {
      margin-top: 30px;
    }

    .leaderboard h3 {
      font-size: 1.2rem;
      color: #a8dadc;
      margin-bottom: 15px;
      text-align: center;
    }

    .leaderboard-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 15px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .leaderboard-item.you {
      background: rgba(78, 205, 196, 0.2);
      border: 1px solid #4ecdc4;
    }

    .leaderboard-rank {
      width: 30px;
      color: #a8dadc;
    }

    .leaderboard-name {
      flex: 1;
    }

    .leaderboard-score {
      color: #4ecdc4;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Pub Quiz</h1>
      <div class="player-name" id="playerNameDisplay"></div>
    </header>

    <div class="status-bar">
      <div class="status-item">
        <div class="status-label">Vraag</div>
        <div class="status-value" id="questionProgress">-</div>
      </div>
      <div class="status-item">
        <div class="status-label">Jouw Score</div>
        <div class="status-value" id="yourScore">0</div>
      </div>
      <div class="status-item">
        <div class="status-label">Positie</div>
        <div class="status-value" id="yourRank">-</div>
      </div>
    </div>

    <div id="mainContent">
      <!-- Content injected by JS -->
    </div>

    <div class="leaderboard" id="leaderboard">
      <h3>Scoreboard</h3>
      <div id="leaderboardList"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let playerName = '';
    let currentState = null;
    let players = [];
    let myAnswers = {};

    // Get player name from URL
    const path = window.location.pathname;
    const match = path.match(/\/quiz\/(.+)/);
    if (match && match[1] !== 'admin') {
      playerName = decodeURIComponent(match[1]);
      document.getElementById('playerNameDisplay').textContent = playerName;
      socket.emit('playerJoin', playerName);
    }

    socket.on('gameState', (state) => {
      currentState = state;
      render();
    });

    socket.on('playerUpdate', (playerData) => {
      players = playerData;
      updateStatusBar();
      renderLeaderboard();
    });

    function updateStatusBar() {
      const me = players.find(p => p.name === playerName);
      if (me) {
        document.getElementById('yourScore').textContent = me.score;
        const rank = players.findIndex(p => p.name === playerName) + 1;
        document.getElementById('yourRank').textContent = `#${rank}`;
      }

      if (currentState && currentState.quizStarted && currentState.currentQuestion) {
        document.getElementById('questionProgress').textContent =
          `${currentState.currentQuestionIndex + 1}/${currentState.totalQuestions}`;
      }
    }

    function render() {
      const mainContent = document.getElementById('mainContent');

      if (!currentState || !currentState.quizStarted) {
        mainContent.innerHTML = `
          <div class="waiting-screen">
            <h2>Wachten op start...</h2>
            <p>De quizmaster start zo de quiz!</p>
          </div>
        `;
        return;
      }

      if (!currentState.currentQuestion) {
        mainContent.innerHTML = `
          <div class="waiting-screen">
            <h2>Quiz Afgelopen!</h2>
            <p>Bekijk je eindpositie hieronder</p>
          </div>
        `;
        return;
      }

      const questionId = currentState.currentQuestion.id;
      const myAnswer = myAnswers[questionId] || '';
      const hasSubmitted = myAnswer !== '';

      let answerHtml = '';
      if (currentState.showAnswer) {
        answerHtml = `
          <div class="answer-reveal">
            <div class="label">Het juiste antwoord:</div>
            <div class="correct-answer">${currentState.currentQuestion.answer}</div>
          </div>
          ${hasSubmitted ? `
            <div class="your-answer">
              <div class="label">Jouw antwoord:</div>
              <div class="text">${myAnswer}</div>
            </div>
          ` : ''}
        `;
      }

      mainContent.innerHTML = `
        <div class="question-section">
          <div class="question-card">
            <div class="question-number">Vraag ${currentState.currentQuestionIndex + 1}</div>
            <div class="question-text">${currentState.currentQuestion.question}</div>
          </div>

          ${!currentState.showAnswer ? `
            <div class="answer-section">
              <input
                type="text"
                class="answer-input"
                id="answerInput"
                placeholder="Typ je antwoord..."
                value="${myAnswer}"
                ${hasSubmitted ? 'readonly' : ''}
              />
              <button
                class="submit-btn"
                id="submitBtn"
                onclick="submitAnswer()"
                ${hasSubmitted ? 'disabled' : ''}
              >
                ${hasSubmitted ? 'Antwoord verzonden!' : 'Verzenden'}
              </button>
              ${hasSubmitted ? `
                <div class="submitted-badge">
                  <div class="icon">✓</div>
                  <div>Je antwoord is opgeslagen</div>
                </div>
              ` : ''}
            </div>
          ` : ''}

          ${answerHtml}
        </div>
      `;

      // Focus input if not submitted
      if (!hasSubmitted && !currentState.showAnswer) {
        setTimeout(() => {
          const input = document.getElementById('answerInput');
          if (input) input.focus();
        }, 100);
      }
    }

    function submitAnswer() {
      const input = document.getElementById('answerInput');
      const answer = input.value.trim();

      if (!answer || !currentState?.currentQuestion) return;

      const questionId = currentState.currentQuestion.id;
      myAnswers[questionId] = answer;

      socket.emit('submitAnswer', {
        playerName,
        questionId,
        answer
      });

      render();
    }

    function renderLeaderboard() {
      const list = document.getElementById('leaderboardList');
      list.innerHTML = players.slice(0, 10).map((player, index) => `
        <div class="leaderboard-item ${player.name === playerName ? 'you' : ''}">
          <span class="leaderboard-rank">${index + 1}.</span>
          <span class="leaderboard-name">${player.name}</span>
          <span class="leaderboard-score">${player.score} pts</span>
        </div>
      `).join('');
    }

    // Handle enter key for submit
    document.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        submitAnswer();
      }
    });

    // Initial render
    render();
  </script>
</body>
</html>
